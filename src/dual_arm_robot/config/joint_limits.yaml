# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
#
# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys
# [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
#
# Units:
#   max_velocity      rad/s   (= deg/s × π/180)
#   max_acceleration  rad/s^2 (= deg/s^2 × π/180)
#
# Value guide:
#   J1..J3 (base/shoulder/elbow):  1.57 rad/s (90 deg/s),  3.14 rad/s^2 (180 deg/s^2)
#   J4..J7 (wrist):                3.14 rad/s (180 deg/s), 6.28 rad/s^2 (360 deg/s^2)
#   head_pan / head_tilt:          1.50 / 1.00 rad/s,      3.00 / 2.00 rad/s^2
#
# NOTE: keep these values CONSISTENT with
#   dual_arm.ros2_control.xacro  <param name="max_joint_velocity_deg_s">   (90.0)
#   dual_arm.ros2_control.xacro  <param name="max_joint_acceleration_deg_s2"> (180.0)
# so MoveIt planning, JTC execution and the hardware interface limiter agree.

joint_limits:
  # ============================================================
  # Left arm
  # ============================================================
  arm_J1_l:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J2_l:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J3_l:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J4_l:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J5_l:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J6_l:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J7_l:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28

  # ============================================================
  # Right arm
  # ============================================================
  arm_J1_r:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J2_r:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J3_r:
    has_velocity_limits: true
    max_velocity: 1.57
    has_acceleration_limits: true
    max_acceleration: 3.14
  arm_J4_r:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J5_r:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J6_r:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28
  arm_J7_r:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 6.28

  # ============================================================
  # Head
  # ============================================================
  head_pan:
    has_velocity_limits: true
    max_velocity: 1.50
    has_acceleration_limits: true
    max_acceleration: 3.00
  head_tilt:
    has_velocity_limits: true
    max_velocity: 1.00
    has_acceleration_limits: true
    max_acceleration: 2.00