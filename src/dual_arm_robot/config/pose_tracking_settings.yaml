#################################
# PID parameters for pose seeking
#################################

# Maximum value of error integral for all PID controllers
windup_limit: 0.05 # 0.05

# PID gains
x_proportional_gain: 52.0
y_proportional_gain: 52.0
z_proportional_gain: 52.0
x_integral_gain: 20.0
y_integral_gain: 20.0
z_integral_gain: 22.0
x_derivative_gain: 0.1
y_derivative_gain: 0.1
z_derivative_gain: 0.2

angular_proportional_gain: 52.0
angular_integral_gain: 20.0
angular_derivative_gain: 0.1