left_hand_controller:
  ros__parameters:
    joints:
      - hand_J1_l
      - hand_J2_l
      - hand_J2_l_1
      - hand_J2_l_2
      - hand_J3_l
      - hand_J3_l_1
      - hand_J4_l
      - hand_J4_l_1
      - hand_J5_l
      - hand_J5_l_1
      - hand_J6_l
      - hand_J6_l_1
    interface_name: position

right_gripper_controller:
  ros__parameters:
    joints:
      - gripper_J1_r
    interface_name: position